name: Gatsby Publish

on:
  push:
    branches:
      - community-deploy

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3
      - uses: enriikke/gatsby-gh-pages-action@v2
        with:
          access-token: ${{ secrets.ACCESS_TOKEN }}
          working-dir: ./client
          gatsby-args: --prefix-paths
          deploy-branch: gh-pages
